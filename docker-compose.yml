services:
  postgres:
    image: postgres:16-alpine
    container_name: mockmint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mockmint
      POSTGRES_PASSWORD: mockmint
      POSTGRES_DB: mockmint
    ports:
      - "5432:5432"
    volumes:
      - mockmint-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockmint -d mockmint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mockmint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mockmint-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mockmint-pgdata:
  mockmint-redisdata:
